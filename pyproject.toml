[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rudraanvil"
version = "0.1.0"
description = "Autonomous coding agent CLI tool using deepagents framework"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Archish" }
]
keywords = ["ai", "agent", "coding", "cli", "deepagents", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]

dependencies = [
    # Core Agent Framework
    "deepagents>=0.4.12",
    "langgraph>=1.1.3",
    "langgraph-checkpoint>=4.0.1",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langgraph-prebuilt>=1.0.8",
    # LLM Integration - Ollama
    "langchain>=1.2.13",
    "langchain-core>=1.2.23",
    "langchain-ollama>=1.0.1",
    "langchain-community>=0.4.1",
    # CLI Interface & Terminal UI
    "typer>=0.24.1",
    "rich>=14.3.3",
    # Web Server (optional API layer)
    "fastapi>=0.135.2",
    "uvicorn[standard]>=0.40.0",
    # Environment Configuration
    "python-dotenv>=1.2.1",
    # Code Quality & Linting Tools
    "ruff>=0.15.8",
    # Testing Framework
    "pytest>=9.0.2",
    # Web Search Tools
    "tavily-python>=0.7.20",
    "duckduckgo-search>=7.0.0",
    # HTTP Requests
    "requests>=2.32.0",
    # File watching for watch command
    "watchdog>=4.0.0",
    # Interactive REPL prompt with blinking cursor
    "prompt-toolkit>=3.0.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
]

[project.scripts]
rudraanvil = "rudraanvil.cli:app"

[project.urls]
Homepage = "https://github.com/archish/RudraAnvil"
Repository = "https://github.com/archish/RudraAnvil"

[tool.hatch.build.targets.wheel]
packages = ["src/rudraanvil"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
