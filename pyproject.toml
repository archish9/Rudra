[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rudra"
version = "0.2.0"
description = "Local-first autonomous coding agent for the terminal — plans, writes, tests, reviews and fixes code, with any model you choose"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Archish" }
]
keywords = ["ai", "agent", "coding", "cli", "autonomous-agent", "llm", "local-first", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]

dependencies = [
    # Core Agent Framework
    # EXACT pin: src/rudra/compat/deepagents_path.py monkeypatches deepagents
    # internals and src/rudra/middleware/task_anchor.py imports a private
    # module. Re-verify both before bumping. See TODO.md U.4, U.13, C0.8.
    "deepagents==0.7.4",
    "langgraph>=1.1.3",
    "langgraph-checkpoint>=4.0.1",
    "langgraph-checkpoint-sqlite>=3.0.3",
    # Imported at runtime by main_agent.create_main_agent; was transitive only.
    "aiosqlite>=0.22.1",
    "langgraph-prebuilt>=1.0.8",
    # LLM Integration
    "langchain>=1.3.14",
    "langchain-core>=1.5.0",
    "langchain-ollama>=1.1.0",
    # Transitive hard dependencies of deepagents 0.7.4, declared
    # intentionally rather than inherited silently. See TODO.md U.2.
    "langchain-anthropic>=1.5.3",
    "langchain-google-genai>=4.3.1",
    # Every OpenAI-compatible endpoint — vLLM, OpenRouter, LM Studio, Groq,
    # Together — goes through ChatOpenAI with a base_url. See TODO.md C1.2.
    "langchain-openai>=1.4.1",
    "langsmith>=0.10.9",
    # MCP (Step 13, C4.1). Servers are reached through three meta-tools, so
    # this is the only new runtime dependency MCP support adds; it pulls
    # mcp>=1.24.0 itself.
    "langchain-mcp-adapters>=0.3.1",
    # Long-term memory (Step 14, C8.1). MemPalace is mandatory for every
    # user (S14.2) -- never an extra. It pulls chromadb, which pulls
    # onnxruntime, grpcio, kubernetes and opentelemetry: ~64 MB of wheels,
    # plus an ~80 MB ONNX MiniLM model on first embedding call. Every
    # import of it is function-local inside rudra/memory/store.py.
    "mempalace>=3.7.1",
    "wcmatch>=11.0",
    "packaging>=23.2",
    # CLI Interface & Terminal UI
    "typer>=0.24.1",
    "rich>=14.3.3",
    # Environment Configuration
    "python-dotenv>=1.2.1",
    # Interactive REPL prompt with blinking cursor
    "prompt-toolkit>=3.0.0",
    # Bundled verification toolchain (Step 9a, S9a.3). Runtime, not dev:
    # `rudra verify` runs these against the user's project when the project
    # brings none of its own. Invoked as `sys.executable -m <tool>`, never
    # via PATH -- see stacks/detect.py::_bundled.
    "ruff>=0.15.8",
    "mypy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    # Step 9b: run_subagent is async because run_with_approvals streams from
    # astream. No async tests existed before it.
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
rudra = "rudra.cli:app"

[project.urls]
Homepage = "https://github.com/archish9/Rudra"
Repository = "https://github.com/archish9/Rudra"

[tool.hatch.build.targets.wheel]
packages = ["src/rudra"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored third-party corpora are frozen and byte-identical to upstream
# (spec S11a.3). They ship no Python today; this keeps a future bundle that
# does from silently entering Rudra's lint gate.
exclude = ["src/rudra/skills/bundles"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "live: needs a reachable model backend and RUDRA_LIVE_TESTS=1; never runs in CI",
]
# `auto` so an async test needs no per-test marker. Added in Step 9b with
# the first async code under test.
asyncio_mode = "auto"
