[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rudraanvil"
version = "0.1.0"
description = "Autonomous coding agent CLI tool using deepagents framework"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Archish" }
]
keywords = ["ai", "agent", "coding", "cli", "deepagents", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]

dependencies = [
    # Core Agent Framework
    "deepagents>=0.3.9",
    
    # LLM Integration - Ollama
    "langchain-ollama>=1.0.1",
    "langchain-community>=0.4.1",
    
    # CLI Interface & Terminal UI
    "typer>=0.21.1",
    "rich>=14.2.0",
    "click>=8.1.0",
    
    # Web Server (optional API layer)
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    
    # Environment Configuration
    "python-dotenv>=1.2.1",
    
    # Code Quality & Linting Tools
    "ruff>=0.14.13",
    
    # Testing Framework
    "pytest>=9.0.2",
    
    # Web Search Tools
    "tavily-python>=0.7.20",
    "duckduckgo-search>=7.0.0",
    
    # HTTP Requests
    "requests>=2.32.0",
    
    # File watching for watch command
    "watchdog>=4.0.0",
]

[project.scripts]
rudraanvil = "rudraanvil.cli:app"

[project.urls]
Homepage = "https://github.com/archish/RudraAnvil"
Repository = "https://github.com/archish/RudraAnvil"

[tool.hatch.build.targets.wheel]
packages = ["src/rudraanvil"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
