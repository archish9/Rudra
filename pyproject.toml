[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rudra"
version = "0.2.0"
description = "Autonomous coding agent CLI tool using deepagents framework"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Archish" }
]
keywords = ["ai", "agent", "coding", "cli", "deepagents", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]

dependencies = [
    # Core Agent Framework
    # EXACT pin: src/rudra/compat/deepagents_path.py monkeypatches deepagents
    # internals and src/rudra/middleware/task_anchor.py imports a private
    # module. Re-verify both before bumping. See TODO.md U.4, U.13, C0.8.
    "deepagents==0.7.4",
    "langgraph>=1.1.3",
    "langgraph-checkpoint>=4.0.1",
    "langgraph-checkpoint-sqlite>=3.0.3",
    # Imported at runtime by main_agent.create_main_agent; was transitive only.
    "aiosqlite>=0.22.1",
    "langgraph-prebuilt>=1.0.8",
    # LLM Integration
    "langchain>=1.3.14",
    "langchain-core>=1.5.0",
    "langchain-ollama>=1.1.0",
    # Transitive hard dependencies of deepagents 0.7.4, declared
    # intentionally rather than inherited silently. See TODO.md U.2.
    "langchain-anthropic>=1.5.3",
    "langchain-google-genai>=4.3.1",
    # Every OpenAI-compatible endpoint — vLLM, OpenRouter, LM Studio, Groq,
    # Together — goes through ChatOpenAI with a base_url. See TODO.md C1.2.
    "langchain-openai>=1.4.1",
    "langsmith>=0.10.9",
    "wcmatch>=11.0",
    "packaging>=23.2",
    # CLI Interface & Terminal UI
    "typer>=0.24.1",
    "rich>=14.3.3",
    # Environment Configuration
    "python-dotenv>=1.2.1",
    # Interactive REPL prompt with blinking cursor
    "prompt-toolkit>=3.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.8",
    "pytest>=9.0.2",
]

[project.scripts]
rudra = "rudra.cli:app"

[project.urls]
Homepage = "https://github.com/archish9/RudraAnvil"
Repository = "https://github.com/archish9/RudraAnvil"

[tool.hatch.build.targets.wheel]
packages = ["src/rudra"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
