name: CI

# Pull requests only. Direct commits to main are gated locally by
# .githooks/pre-push, which runs these same three commands (A3.9). CI's
# remaining job is to be an environment that is not the committer's: it
# installs from uv.lock on a clean machine and has no .env, which is where
# every defect found on 2026-08-11 actually lived (A3.8, A3.5, A1.51).
#
# The trade is explicit: a direct push to main with --no-verify, or from a
# clone where core.hooksPath was never set, is now checked by nothing.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      # Absolute gate. Step 3 (C0.4) got this to zero; it must stay there.
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # `uv sync` installs the project itself, which test_package_version.py
      # requires: it compares __version__ against installed distribution
      # metadata, and an uninstalled source tree yields 0.0.0+unknown.
      - run: uv sync --python ${{ matrix.python-version }}
      # The suite runs under coverage rather than beside it. A standalone
      # coverage job re-ran the whole suite a second time to print a number
      # with no --fail-under -- a quarter of CI's wall time and a fourth
      # status check for something that can never fail the build (A3.6).
      - run: uv run --python ${{ matrix.python-version }} --with coverage coverage run -m pytest -q
      # Reported, never gated. A gate at today's number (79% as of Step 7 --
      # the 47% this comment used to cite predates Steps 5-7) is meaningless,
      # and one set higher pressures low-value tests against code Step 9
      # replaces. Revisit after Step 9. No --fail-under.
      - run: uv run --python ${{ matrix.python-version }} --with coverage coverage report --include="src/*"
